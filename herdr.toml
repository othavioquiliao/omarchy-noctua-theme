# Noctua theme for herdr (https://github.com/herdrdev/herdr)
#
# herdr is not themed by Omarchy, so this file is opt-in. Either install the
# bundled hook (see herdr.hook.sh) to keep herdr in sync on every theme
# change, or merge the blocks below into ~/.config/herdr/config.toml by hand
# and run `herdr server reload-config` (the server keeps the old config in
# memory; restarting the client is not enough).
#
# The base is herdr's built-in `one-dark`, whose eight accent colors already
# match Noctua exactly. Only surfaces and text hierarchy are overridden.
#
# Do not use `name = "terminal"` with this theme: it maps `text` to the
# terminal foreground and `subtext0` to ANSI 7, which are both #abb2bf in
# Noctua, so inactive sidebar labels render identically to the active one.

[theme]
name = "one-dark"
auto_switch = false

[theme.custom]
panel_bg = "#242424"  # Noctua background (one-dark ships #282c34)
surface0 = "#2e2e2e"  # selected rows (one-dark ships #2c313a)
surface1 = "#3a3a3a"  # hover / active states

# surface_dim paints the active item's background AND the sidebar separators
# with the same value, so it cannot be blue on the line and grey on the fill.
# This muted blue-grey reads as color on a 1px rule and stays sober behind the
# selected row. Note it also lowers contrast for any text drawn on top of it,
# which is why `text` below is pure white rather than a soft off-white.
surface_dim = "#3a4a5c"

# Text hierarchy. Contrast is measured against the background each element
# actually sits on, not against panel_bg alone:
text     = "#ffffff"  # active item title,    9.08:1 over #3a4a5c
overlay1 = "#c5ccd8"  # active item sub-label, 5.62:1 over #3a4a5c
subtext0 = "#d0d4db"  # inactive space title, 10.44:1 over #242424
# overlay0 is the last step still meeting WCAG AA over #242424; the next tone
# down would be 4.11:1.
overlay0 = "#848c99"  # inactive sub-labels,   4.58:1 over #242424
